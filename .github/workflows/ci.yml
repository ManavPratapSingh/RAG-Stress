name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (Ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Typecheck (Mypy)
        run: |
          mypy src

      - name: Unit & Integration Tests (Pytest)
        run: |
          pytest tests/ --cov=ragstress --cov-report=term-missing

      - name: Validate Suite & Distractor Hardness
        run: |
          ragstress validate-suite data/suites/smoke.jsonl
          ragstress hardness data/suites/smoke.jsonl

      - name: Run Offline Cassette Benchmark
        run: |
          ragstress run --generator replay:gpt-4o-mini --suite data/suites/smoke.jsonl --run-id bench_replay --out runs/bench_replay

      - name: Generate Evaluation Report
        run: |
          ragstress report runs/bench_replay

      - name: Upload Benchmark Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: runs/bench_replay/report.md
