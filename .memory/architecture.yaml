system:
  name: RAG-Stress
  description: RAG Hallucination & Retrieval Stress-Test Harness
  version: "0.1.0"
  runtime: Python 3.12+

pipeline_stages:
  kb_generation:
    owns:
      - synthetic entity names
      - structured facts
      - natural language passage rendering
      - question generation
    status: implemented (Phase 1)
  stress_engine:
    owns:
      - distractor synthesis
      - conflict twins (dated, authority, unresolvable)
      - position shuffling & opaque doc IDs
    status: implemented (Phase 3)
  retrieval_stack:
    owns:
      - sentence chunking
      - custom BM25
      - HashEmbedder & SentenceTransformerEmbedder
      - FlatStore & QdrantStore
      - retrieval metrics (Hit@K, Recall@K, Precision@K, MRR, nDCG)
    status: implemented (Phase 2)
  generator_adapter:
    owns:
      - provider clients (OpenAI)
      - scripted generators
      - cassette record/replay
    status: implemented (Phase 4)
  graders_and_taxonomy:
    owns:
      - value normalization
      - correctness by item kind
      - value provenance / hallucination
      - citations & conflict grading
      - failure taxonomy
    status: implemented (Phase 5)
  suites_and_runner:
    owns:
      - smoke & core suites
      - runner execution pool
      - trace generation
    status: implemented (Phase 6)
  reports_and_stats:
    owns:
      - Wilson intervals
      - paired bootstrap & McNemar test
      - lost-in-the-middle score
      - report markdown & CLI compare
    status: implemented (Phase 7)
  interventions:
    owns:
      - edge reordering
      - lexical reranking
      - check prompt injection
      - score threshold abstention
    status: planned (Phase 8)

