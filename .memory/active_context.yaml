key_assumptions:
  - Hallucination is defined as value provenance == "none" (not found in any structured fact within the provided context).
  - Unresolvable conflict items require setting conflict=True and listing complete conflicting values, without asserting an answer.
  - Failure taxonomy uses strict first-match-wins ordering (format_error > retrieval_miss > stale_adopted > distractor_adopted > hallucinated > false_abstain > conflict_ignored > conflict_incomplete > other_wrong).
