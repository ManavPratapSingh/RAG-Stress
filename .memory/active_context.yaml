key_assumptions:
  - Wilson 95% score intervals provide reliable binomial proportion coverage near boundaries (0% and 100%).
  - Paired exact McNemar tests condition on discordant pairs to maximize statistical power.
  - Closed-book parametric leakage is strictly unanswerable items where the model asserted an answer matching the gold value.
  - CLI compare command strictly refuses on item-set mismatch to prevent invalid paired statistics.

